name: Public ZK build

on:
  push:
    branches:
      - master
    paths:
      - ".github/workflows/public-zk-build.yml"
      - "scripts/generate_public_zk.py"
  repository_dispatch:
    types:
      - public-zk-updated
  workflow_dispatch:
    inputs:
      source_ref:
        description: ZK ref to publish
        required: false
        default: main

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build public ZK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website
        uses: actions/checkout@v4

      - name: Checkout ZK source
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.client_payload.source_repository || 'christopher-demarco/zettelkasten' }}
          ref: ${{ github.event.client_payload.source_sha || inputs.source_ref || 'main' }}
          token: ${{ secrets.ZK_READ_TOKEN }}
          path: _zk_source

      - name: Configure Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4.6"
          bundler-cache: true

      - name: Generate public ZK files
        run: python3 scripts/generate_public_zk.py --source _zk_source --out zk

      - name: Build Jekyll site
        run: bundle exec jekyll build

      - name: Commit generated public ZK
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zk
          if git diff --cached --quiet; then
            echo "No generated public ZK changes"
            exit 0
          fi
          git commit -m "Regenerate public ZK"
          git push
